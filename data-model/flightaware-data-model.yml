traversal_note: >-
  The canonical agent path is: resolve an ident or search criteria to an fa_flight_id, then use that
  id for every flight-scoped call. Airport and operator codes resolve through the /canonical
  endpoints when the scheme (ICAO / IATA / LID) is uncertain.
