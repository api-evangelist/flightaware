description: >-
  Entity-relationship graph for AeroAPI, derived from the contract. A CAVEAT THAT SHAPES EVERYTHING
  BELOW: AeroAPI 4.30.0 declares no `components.schemas` at all — every response body is defined
  inline on its operation, so there is not a single `$ref` in the document to follow. The graph was
  therefore derived from repeated inline shapes and from id-reference field names, not from schema
  reuse. That is also a finding in its own right: a client cannot generate shared model types from
  this contract, and the same Flight or Airport object is redefined dozens of times.
schema_reuse:
  components_schemas: 0
  refs_in_document: 0
  note: >-
    Only `components.securitySchemes` is populated. The airport object alone is redefined more than
    seventy times across the document.
identifiers:
  - id: fa_flight_id
    entity: Flight
    description: >-
      FlightAware's opaque per-flight identifier and the primary key of the flight surface. Every
      flight-scoped operation (position, track, route, map, and their history equivalents) requires
      it; passing a bare ident returns 400.
    obtained_from: [get_flight, get_flights_by_search, get_flights_by_advanced_search, get_airport_flights]
    occurrences: 172
  - id: ident
    entity: Flight
    description: 'Flight number or aircraft registration/tail. Ambiguous by design — `ident_type` disambiguates (registration vs designator).'
    occurrences: 254
  - id: registration
    entity: Aircraft
    description: Aircraft tail number. The key for owner lookup and last-flight history.
    occurrences: 167
  - id: code_icao / code_iata / code_lid
    entity: Airport, Operator
    description: >-
      Three parallel first-class code schemes, never collapsed. `id_type` on the canonical endpoints
      takes 'icao', 'iata' or 'lid'. The older conflated `alternate_ident` field is deprecated.
    occurrences: 224
  - id: inbound_fa_flight_id
    entity: Flight
    description: The fa_flight_id of the aircraft's previous flight — the link that makes aircraft rotation traceable.
    occurrences: 66
  - id: atc_ident
    entity: Flight
    description: The ATC identifier where it differs from the flight identifier.
    occurrences: 59
